<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16100f">
  <meta name="description" content="Wedding invitation of Rahul and Pooja, 7 February 2027, Ahmedabad.">
  <title>Rahul &amp; Pooja — Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Rasa:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Hindi:ital@0;1&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--night:#16100f;--velvet:#241817;--ivory:#fbf6ee;--paper:#f4ecdf;--champagne:#c9a96e;--gold:#b08d4f;--ink:#2a1d1a;--muted:#7d6a5e;--wine:#6e1f2a;--line:#c9a96e66}
    *{box-sizing:border-box}html,body{margin:0;height:100%}
    body{background:var(--night);color:var(--ink);font-family:'Cormorant Garamond',serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    body.is-reading{overflow-y:auto;overflow-x:hidden}
    body[data-lang="gu"] .t{font-family:'Rasa',serif}
    body[data-lang="hi"] .t{font-family:'Tiro Devanagari Hindi',serif}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,a:focus-visible{outline:1px solid var(--champagne);outline-offset:4px}
    .sans{font-family:'Jost',sans-serif;letter-spacing:.32em;text-transform:uppercase;font-weight:400}
    /* Indic scripts break apart with wide tracking, so labels keep only a light spacing there. */
    body[data-lang="gu"] .sans.t,body[data-lang="hi"] .sans.t{letter-spacing:.06em;font-size:.95rem}
    body[data-lang="gu"] .scroll-cue,body[data-lang="hi"] .scroll-cue{font-size:.85rem}
    body[data-lang="gu"] .count small,body[data-lang="hi"] .count small{font-size:.8rem}
    /* The Gujarati italic face lacks Gujarati glyphs, so Gujarati text always stays upright. */
    body[data-lang="gu"] .t{font-style:normal}
    #dust{position:fixed;inset:0;z-index:1;pointer-events:none}

    /* ---------- stage 1: language ---------- */
    .stage{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 80% at 50% 0%,#3a2622 0%,var(--velvet) 45%,var(--night) 100%);transition:opacity .9s ease,visibility .9s}
    .stage.is-gone{opacity:0;visibility:hidden;pointer-events:none}
    .lang-box{width:min(100%,380px);text-align:center;color:var(--paper)}
    .lang-box>*{opacity:0;transform:translateY(16px);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}
    .lang-box>*:nth-child(2){animation-delay:.15s}.lang-box>*:nth-child(3){animation-delay:.3s}.lang-box>*:nth-child(4){animation-delay:.45s}.lang-box>*:nth-child(5){animation-delay:.6s}
    .monogram{display:grid;place-items:center;width:96px;height:96px;margin:0 auto;border:1px solid var(--line);border-radius:50%;position:relative}
    .monogram:after{content:"";position:absolute;inset:6px;border:1px solid #c9a96e33;border-radius:50%}
    .monogram span{font-family:'Pinyon Script',cursive;font-size:2.4rem;color:var(--champagne);line-height:1}
    .lang-kicker{margin:28px 0 6px;font-size:.66rem;color:#c9a96ecc}
    .lang-title{margin:0 0 30px;font-size:1.5rem;font-style:italic;font-weight:400;color:#efe4d2}
    .lang-list{display:grid;gap:10px}
    .lang-option{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 22px;border:1px solid var(--line);border-radius:2px;background:#ffffff05;color:var(--paper);font-size:1.25rem;transition:background .4s,border-color .4s,transform .4s}
    .lang-option:hover{background:#c9a96e14;border-color:var(--champagne);transform:translateY(-1px)}
    .lang-option small{font-family:'Jost',sans-serif;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:#c9a96ebb}
    .lang-option[data-pick="gu"] b{font-family:'Rasa',serif;font-weight:500}.lang-option[data-pick="hi"] b{font-family:'Tiro Devanagari Hindi',serif;font-weight:400}.lang-option[data-pick="en"] b{font-weight:500}
    .lang-foot{margin-top:28px;font-size:.62rem;color:#c9a96e88}

    /* ---------- stage 2: envelope ---------- */
    .env-wrap{display:grid;justify-items:center;gap:34px;perspective:1400px}
    .envelope{position:relative;width:min(84vw,380px);aspect-ratio:1.42;transform-style:preserve-3d;opacity:0;transform:translateY(40px) rotateX(18deg);transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.2,.8,.2,1)}
    .stage.show-env .envelope{opacity:1;transform:none}
    .env-back{position:absolute;inset:0;background:linear-gradient(160deg,#efe5d4,#e3d5bf);border-radius:4px;box-shadow:0 40px 80px #0008,0 0 0 1px #c9a96e55 inset}
    .letter{position:absolute;left:6%;right:6%;top:6%;height:88%;background:var(--ivory);border-radius:2px;box-shadow:0 0 0 1px #c9a96e55 inset;display:grid;place-items:center;text-align:center;transition:transform 1.3s cubic-bezier(.6,0,.2,1) 1s;z-index:2}
    .letter p{margin:0;font-family:'Pinyon Script',cursive;font-size:clamp(1.8rem,8vw,2.4rem);color:var(--wine)}
    .letter small{display:block;margin-top:6px;font-size:.55rem;color:var(--gold)}
    .env-front{position:absolute;inset:0;z-index:3;background:linear-gradient(170deg,#f3eadb,#e6d9c3);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:4px;box-shadow:0 0 0 1px #c9a96e44 inset}
    .env-front:after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,#c9a96e55 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,#c9a96e55 50%,transparent 50.4%)}
    .flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:4;transform-origin:top center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,0,.3,1) .35s,z-index 0s linear .85s}
    .flap i{position:absolute;inset:0;background:linear-gradient(180deg,#ebdfcb,#dccbb0);clip-path:polygon(0 0,100% 0,50% 94%);backface-visibility:hidden;filter:drop-shadow(0 6px 6px #0002)}
    .flap i+i{transform:rotateY(180deg) rotateZ(180deg);background:linear-gradient(0deg,#e8dcc6,#f1e8d9)}
    .seal{position:absolute;left:50%;top:56%;z-index:6;width:70px;height:70px;margin:-35px 0 0 -35px;border:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#9c3341,#6e1f2a 55%,#4a121a);box-shadow:0 6px 14px #0006,inset 0 -3px 6px #0005,inset 0 3px 5px #ffffff22;transition:transform .5s ease,opacity .5s ease}
    .seal:before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px dashed #e7b9a466}
    .seal span{font-family:'Pinyon Script',cursive;color:#f2d3c4;font-size:1.55rem;line-height:1}
    .seal:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid #c9a96e88;animation:ping 2.2s ease-out infinite}
    .env-hint{margin:0;color:#e9dcc7;font-size:1.1rem;font-style:italic;opacity:0;transition:opacity 1s .8s}
    .stage.show-env .env-hint{opacity:.85}
    .stage.is-opening .seal{transform:scale(1.4);opacity:0}
    .stage.is-opening .flap{transform:rotateX(180deg);z-index:1}
    .stage.is-opening .letter{transform:translateY(-62%)}
    .stage.is-opening .env-hint{opacity:0;transition-delay:0s}
    .stage.is-opening .envelope{transition:transform 1s cubic-bezier(.6,0,.3,1) 2.2s,opacity .8s ease 2.4s;transform:translateY(30px) scale(1.1);opacity:0}

    /* ---------- stage 3: card ---------- */
    .card{position:relative;z-index:2;opacity:0;transition:opacity 1.2s ease}
    body.is-reading .card{opacity:1}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 12px;pointer-events:none;opacity:0;transition:opacity 1s 1s}
    body.is-reading .topbar{opacity:1}
    .topbar>*{pointer-events:auto}
    .pill{display:flex;gap:2px;padding:3px;border:1px solid #c9a96e55;border-radius:999px;background:#16100fcc;backdrop-filter:blur(10px)}
    .pill button{border:0;background:none;color:#e9dcc7;padding:6px 11px;border-radius:999px;font-size:.82rem}
    .pill button[data-lang-choice="gu"]{font-family:'Rasa',serif}.pill button[data-lang-choice="hi"]{font-family:'Tiro Devanagari Hindi',serif}
    .pill button[aria-pressed="true"]{background:var(--champagne);color:var(--night)}
    .icon-btn{width:38px;height:38px;border:1px solid #c9a96e55;border-radius:50%;background:#16100fcc;color:#e9dcc7;font-family:system-ui,sans-serif;font-size:1.05rem;line-height:1;backdrop-filter:blur(10px)}

    .hero{min-height:100svh;display:grid;place-items:center;padding:90px 22px 60px;text-align:center;color:var(--paper);background:radial-gradient(90% 60% at 50% 30%,#3a2622,var(--night) 75%)}
    .hero-inner{max-width:560px}
    .invoke{margin:0;font-size:.95rem;color:#c9a96ecc;letter-spacing:.06em}
    .kicker{margin:26px 0 0;font-size:.62rem;color:var(--champagne)}
    .names{margin:22px 0 0;font-weight:400;line-height:1}
    .names .n{display:block;font-family:'Pinyon Script',cursive;font-size:clamp(3.6rem,17vw,6.4rem);color:#f3e7d3;text-shadow:0 0 40px #c9a96e33}
    body[data-lang="gu"] .names .n{font-family:'Rasa',serif;font-weight:500;font-size:clamp(3.2rem,15vw,5.6rem)}
    body[data-lang="hi"] .names .n{font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(3.2rem,15vw,5.6rem)}
    .names .amp{display:block;margin:6px 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.6rem;color:var(--champagne)}
    .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:30px auto}
    .rule:before,.rule:after{content:"";width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--champagne))}.rule:after{transform:scaleX(-1)}
    .rule i{width:6px;height:6px;border:1px solid var(--champagne);transform:rotate(45deg)}
    .hero-date{margin:0;font-size:clamp(1.2rem,5vw,1.5rem);color:#efe4d2}
    .hero-place{margin:6px 0 0;font-size:1rem;color:#c9a96ecc}
    .scroll-cue{margin-top:46px;font-size:.58rem;color:#c9a96e99;animation:bob 2.4s ease-in-out infinite}

    .paper{background:var(--ivory);background-image:radial-gradient(#c9a96e10 1px,transparent 1px);background-size:5px 5px}
    .sec{max-width:620px;margin:0 auto;padding:84px 26px;text-align:center}
    .sec+.sec{border-top:1px solid #c9a96e33}
    .label{margin:0;font-size:.6rem;color:var(--gold)}
    .h{margin:12px 0 0;font-weight:400;font-size:clamp(2rem,8vw,2.7rem);color:var(--ink);line-height:1.2}
    .body{margin:18px auto 0;max-width:470px;font-size:clamp(1.08rem,4vw,1.25rem);line-height:1.75;color:var(--muted)}
    .person{margin-top:34px}
    .person .pre{margin:0;font-size:.95rem;color:var(--gold)}
    .person .who{margin:4px 0 0;font-size:clamp(2.2rem,9vw,3rem);color:var(--wine);line-height:1.15}
    .person .par{margin:6px 0 0;font-size:1.05rem;color:var(--muted)}
    .weds{margin:26px 0 0;font-family:'Pinyon Script',cursive;font-size:2rem;color:var(--champagne)}

    .count{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:34px auto 0;max-width:460px;border:1px solid #c9a96e55}
    .count div{padding:18px 4px}.count div+div{border-left:1px solid #c9a96e55}
    .count b{display:block;font-weight:400;font-size:clamp(1.8rem,8vw,2.6rem);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
    .count small{display:block;margin-top:8px;font-size:.55rem;color:var(--gold)}

    .timeline{position:relative;margin:40px auto 0;max-width:460px;text-align:left}
    .timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--champagne),#c9a96e33)}
    .ev{position:relative;padding:0 0 30px 38px}
    .ev:last-child{padding-bottom:0}
    .ev:before{content:"";position:absolute;left:2px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--ivory);border:1px solid var(--gold)}
    .ev.main:before{background:var(--wine);border-color:var(--wine);box-shadow:0 0 0 4px #6e1f2a22}
    .ev h4{margin:0;font-size:1.32rem;font-weight:500;color:var(--ink)}
    .ev p{margin:4px 0 0;font-size:1.02rem;color:var(--muted);line-height:1.5}
    .ev p em{font-style:normal;color:var(--gold)}

    .venue{margin:20px 0 0;font-size:clamp(1.3rem,5vw,1.6rem);color:var(--ink)}
    .btn{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:14px 28px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:.66rem;transition:background .4s,color .4s}
    .btn:hover{background:var(--ink);color:var(--ivory)}

    .fam{display:grid;gap:6px;margin-top:16px;font-size:clamp(1.05rem,4vw,1.2rem);color:var(--muted)}
    .fam p{margin:0}
    .fam+.label{margin-top:40px}

    .tahuko{background:linear-gradient(180deg,#f6eee2,#efe3d0);border:1px solid #c9a96e55;padding:46px 24px;margin-top:4px;position:relative}
    .tahuko:before,.tahuko:after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--champagne)}
    .tahuko:before{top:8px;left:8px;border-right:0;border-bottom:0}.tahuko:after{bottom:8px;right:8px;border-left:0;border-top:0}
    .poem{margin:18px 0 0;font-style:italic;font-size:clamp(1.15rem,4.4vw,1.35rem);line-height:1.8;color:var(--wine);white-space:pre-line}
    .kids{margin:22px 0 0;font-size:1.05rem;color:var(--ink)}

    .closing{padding:90px 26px 110px;text-align:center;color:var(--paper);background:radial-gradient(90% 70% at 50% 100%,#3a2622,var(--night) 75%)}
    .closing p{margin:0 auto;max-width:460px;font-size:clamp(1.4rem,5.5vw,1.9rem);font-style:italic;line-height:1.5;color:#efe4d2}
    .closing .sign{margin-top:26px;font-family:'Pinyon Script',cursive;font-style:normal;font-size:2.6rem;color:var(--champagne)}

    .reveal{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity 1.2s cubic-bezier(.2,.8,.2,1),transform 1.2s cubic-bezier(.2,.8,.2,1),filter 1.2s}
    .reveal.in{opacity:1;transform:none;filter:none}
    .hero .reveal{transition-delay:calc(var(--d,0)*160ms + .2s)}

    @keyframes rise{to{opacity:1;transform:none}}
    @keyframes ping{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}.reveal{opacity:1;transform:none;filter:none}}
  </style>
</head>
<body data-lang="en">
  <canvas id="dust" aria-hidden="true"></canvas>

  <section class="stage" id="stage" aria-label="Open invitation">
    <div class="lang-box" id="lang-box">
      <div class="monogram"><span>R&amp;P</span></div>
      <p class="lang-kicker sans">The Wedding Invitation</p>
      <h1 class="lang-title">Choose your language</h1>
      <div class="lang-list">
        <button class="lang-option" type="button" data-pick="gu"><b>ગુજરાતી</b><small>Gujarati</small></button>
        <button class="lang-option" type="button" data-pick="hi"><b>हिन्दी</b><small>Hindi</small></button>
        <button class="lang-option" type="button" data-pick="en"><b>English</b><small>English</small></button>
      </div>
      <p class="lang-foot sans">07 · 02 · 2027</p>
    </div>
    <div class="env-wrap" id="env-wrap" hidden>
      <div class="envelope">
        <div class="env-back"></div>
        <div class="letter"><div><p>Rahul &amp; Pooja</p><small class="sans">07 · 02 · 2027</small></div></div>
        <div class="flap"><i></i><i></i></div>
        <div class="env-front"></div>
        <button class="seal" type="button" id="seal" aria-label="Open the invitation"><span>R&amp;P</span></button>
      </div>
      <p class="env-hint t" id="env-hint"></p>
    </div>
  </section>

  <div class="topbar">
    <nav class="pill" aria-label="Language">
      <button type="button" data-lang-choice="gu">ગુજ</button>
      <button type="button" data-lang-choice="hi">हिं</button>
      <button type="button" data-lang-choice="en">EN</button>
    </nav>
    <button class="icon-btn" type="button" id="fs" aria-label="Full screen" hidden>⤢</button>
  </div>

  <main class="card" id="card" aria-live="polite"></main>

  <script>
    const WEDDING_ISO='2027-02-07T12:39:00+05:30';
    const MAP_URL='https://www.google.com/maps/search/?api=1&query=Shree+Umiya+Party+Plot+S.G.+Highway+Ahmedabad';
    const C={
      gu:{hint:'આમંત્રણ ખોલવા સીલ પર ટેપ કરો',invoke:'॥ શ્રી ગણેશાય નમઃ ॥',kicker:'લગ્નોત્સવ',groom:'રાહુલ',bride:'પૂજા',amp:'અને',date:'રવિવાર, ૭ ફેબ્રુઆરી ૨૦૨૭',city:'અમદાવાદ',scroll:'આગળ જુઓ',
        inviteLabel:'સ્નેહભર્યું આમંત્રણ',inviteH:'આપ સહપરિવાર પધારો',invite:'કુળદેવી શ્રી ઉમિયા માતાજીની કૃપાથી અમારા પરિવારના શુભ લગ્ન પ્રસંગે આપ સહપરિવાર પધારી નવદંપતીને આશીર્વાદ આપવા ભાવભર્યું આમંત્રણ છે.',
        gPre:'ચિ.',gPar:'સુપુત્ર શ્રી રમેશભાઈ તથા શ્રીમતી સુનીતાબેન પટેલ',bPre:'ચિ. સૌ. કાં.',bPar:'સુપુત્રી શ્રી મહેશભાઈ તથા શ્રીમતી કલ્પનાબેન શાહ',weds:'સંગ',
        countLabel:'શુભ ઘડીની રાહ',countH:'હસ્તમેળાપ બપોરે ૧૨:૩૯ કલાકે',units:['દિવસ','કલાક','મિનિટ','સેકન્ડ'],

        inviteLabel:'सस्नेह निमंत्रण',inviteH:'आप सपरिवार पधारें',invite:'कुलदेवी श्री उमिया माताजी की कृपा से हमारे परिवार के शुभ विवाह अवसर पर आप सपरिवार पधारकर नवदंपति को आशीर्वाद प्रदान करें, यही हमारी हार्दिक विनती है।',
        gPre:'चि.',gPar:'सुपुत्र श्री रमेशभाई एवं श्रीमती सुनीताबेन पटेल',bPre:'सौ. कां.',bPar:'सुपुत्री श्री महेशभाई एवं श्रीमती कल्पनाबेन शाह',weds:'संग',
        countLabel:'शुभ घड़ी की प्रतीक्षा',countH:'पाणिग्रहण दोपहर 12:39 बजे',units:['दिन','घंटे','मिनट','सेकंड'],
        evLabel:'मांगलिक कार्यक्रम',evH:'विवाह कार्यक्रम',events:[['गणेश स्थापना एवं मंडप मुहूर्त','शुक्रवार, 5 फ़रवरी','प्रातः 9:00 बजे','निवास स्थान'],['मेहंदी रस्म','शुक्रवार, 5 फ़रवरी','दोपहर 3:00 बजे','निवास स्थान'],['संगीत संध्या एवं रास-गरबा','शनिवार, 6 फ़रवरी','सायं 7:00 बजे','श्री उमिया पार्टी प्लॉट'],['हल्दी (पीठी)','रविवार, 7 फ़रवरी','प्रातः 7:30 बजे','निवास स्थान'],['बारात प्रस्थान','रविवार, 7 फ़रवरी','प्रातः 10:30 बजे','निवास स्थान से'],['पाणिग्रहण (हस्तमिलाप)','रविवार, 7 फ़रवरी','दोपहर 12:39 बजे','श्री उमिया पार्टी प्लॉट',1],['प्रीतिभोज','रविवार, 7 फ़रवरी','दोपहर 1:30 बजे','श्री उमिया पार्टी प्लॉट']],
        venueLabel:'विवाह स्थल',venueH:'श्री उमिया पार्टी प्लॉट',venue:'एस.जी. हाईवे, अहमदाबाद, गुजरात',map:'नक्शे में देखें',

        closing:'आपकी उपस्थिति ही हमारा सच्चा उपहार है',sign:'Rahul & Pooja'},
      en:{hint:'Tap the seal to open',invoke:'|| Shree Ganeshaya Namah ||',kicker:'Together with their families',groom:'Rahul',bride:'Pooja',amp:'&',date:'Sunday, 7 February 2027',city:'Ahmedabad',scroll:'Scroll',
        inviteLabel:'With love',inviteH:'You are warmly invited',invite:'With the blessings of Kuldevi Shree Umiya Mataji, we joyfully invite you and your family to celebrate the wedding and bless the couple.',
        gPre:'Chi.',gPar:'Son of Shri Rameshbhai & Smt. Sunitaben Patel',bPre:'Chi. Sau. Kan.',bPar:'Daughter of Shri Maheshbhai & Smt. Kalpanaben Shah',weds:'weds',
        countLabel:'Counting down',countH:'Hastmelap at 12:39 PM',units:['Days','Hours','Mins','Secs'],
        evLabel:'The celebrations',evH:'Wedding Events',events:[['Ganesh Sthapana & Mandap Muhurat','Friday, 5 February','9:00 AM','Residence'],['Mehndi','Friday, 5 February','3:00 PM','Residence'],['Sangeet Sandhya & Raas-Garba','Saturday, 6 February','7:00 PM','Shree Umiya Party Plot'],['Pithi (Haldi)','Sunday, 7 February','7:30 AM','Residence'],['Jaan Prasthan (Baraat)','Sunday, 7 February','10:30 AM','From Residence'],['Hastmelap','Sunday, 7 February','12:39 PM','Shree Umiya Party Plot',1],['Wedding Lunch','Sunday, 7 February','1:30 PM','Shree Umiya Party Plot']],
        venueLabel:'The venue',venueH:'Shree Umiya Party Plot',venue:'S.G. Highway, Ahmedabad, Gujarat',map:'Get directions',
        famLabel:'Invited by',fam:['Shri Bhikhabhai & Smt. Shantaben Patel'],welLabel:'Eagerly awaiting you',wel:['Shri Sureshbhai & Smt. Hetalben Patel','Shri Dineshbhai & Smt. Nehaben Patel','The Entire Patel Family'],
        tahukoH:'Tahuko',tahuko:"Do come to our uncle's wedding, for sure, for sure!\nAnd bring sweet smiles and lots of blessings along.",kids:'Aarav · Vihaan · Krisha · Mahi',
        closing:'Your presence is the most precious gift to us',sign:'Rahul & Pooja'}
    };
    const $=(s)=>document.querySelector(s);
    const esc=(t)=>String(t).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/\n/g,'<br>');
    const num=(v)=>lang==='gu'?String(v).replace(/\d/g,(d)=>'૦૧૨૩૪૫૬૭૮૯'[d]):String(v);
    const params=new URLSearchParams(location.search);
    let lang=['gu','hi','en'].includes(params.get('lang'))?params.get('lang'):'en';
    const stage=$('#stage');

    function render(){
      const c=C[lang];
      document.documentElement.lang=lang;document.body.dataset.lang=lang;
      document.querySelectorAll('[data-lang-choice]').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.langChoice===lang)));
      $('#env-hint').textContent=c.hint;
      const list=(a)=>a.map((x)=>`<p class="t">${esc(x)}</p>`).join('');
      $('#card').innerHTML=`
        <section class="hero"><div class="hero-inner">
          <p class="invoke t reveal" style="--d:0">${esc(c.invoke)}</p>
          <p class="kicker sans t reveal" style="--d:1">${esc(c.kicker)}</p>
          <h1 class="names reveal" style="--d:2"><span class="n">${esc(c.groom)}</span><span class="amp">&amp;</span><span class="n">${esc(c.bride)}</span></h1>
          <div class="rule reveal" style="--d:3"><i></i></div>
          <p class="hero-date t reveal" style="--d:4">${esc(c.date)}</p>
          <p class="hero-place t reveal" style="--d:4">${esc(c.city)}</p>
          <p class="scroll-cue sans t reveal" style="--d:5">${esc(c.scroll)} ↓</p>
        </div></section>
        <div class="paper">
          <section class="sec">
            <p class="label sans t reveal">${esc(c.inviteLabel)}</p>
            <h2 class="h t reveal">${esc(c.inviteH)}</h2>
            <p class="body t reveal">${esc(c.invite)}</p>
            <div class="person reveal"><p class="pre t">${esc(c.gPre)}</p><p class="who t">${esc(c.groom)}</p><p class="par t">${esc(c.gPar)}</p></div>
            <p class="weds reveal">${lang==='en'?'weds':'&amp;'}</p>
            <div class="person reveal" style="margin-top:14px"><p class="pre t">${esc(c.bPre)}</p><p class="who t">${esc(c.bride)}</p><p class="par t">${esc(c.bPar)}</p></div>
          </section>
          <section class="sec">
            <p class="label sans t reveal">${esc(c.countLabel)}</p>
            <h2 class="h t reveal">${esc(c.countH)}</h2>
            <div class="count reveal" id="count"></div>
          </section>
          <section class="sec">
            <p class="label sans t reveal">${esc(c.evLabel)}</p>
            <h2 class="h t reveal">${esc(c.evH)}</h2>
            <div class="timeline">${c.events.map((e)=>`<div class="ev reveal${e[4]?' main':''}"><h4 class="t">${esc(e[0])}</h4><p class="t">${esc(e[1])} · <em>${esc(e[2])}</em><br>${esc(e[3])}</p></div>`).join('')}</div>
          </section>
          <section class="sec">
            <p class="label sans t reveal">${esc(c.venueLabel)}</p>
            <h2 class="h t reveal">${esc(c.venueH)}</h2>
            <p class="body t reveal">${esc(c.venue)}</p>
            <a class="btn sans t reveal" href="${MAP_URL}" target="_blank" rel="noopener noreferrer">${esc(c.map)} →</a>
          </section>
          <section class="sec">
            <p class="label sans t reveal">${esc(c.famLabel)}</p>
            <div class="fam reveal">${list(c.fam)}</div>
            <p class="label sans t reveal">${esc(c.welLabel)}</p>
            <div class="fam reveal">${list(c.wel)}</div>
          </section>
          <section class="sec">
            <div class="tahuko reveal">
              <h2 class="h t">${esc(c.tahukoH)}</h2>
              <p class="poem t">${esc(c.tahuko)}</p>
              <p class="kids t">${esc(c.kids)}</p>
            </div>
          </section>
        </div>
        <section class="closing"><p class="t reveal">${esc(c.closing)}</p><p class="sign reveal">${esc(c.sign)}</p></section>`;
      tick();observe();
    }
    function tick(){
      const el=$('#count');if(!el)return;
      const d=Math.max(0,new Date(WEDDING_ISO)-Date.now());
      const v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
      el.innerHTML=v.map((x,i)=>`<div><b>${num(String(x).padStart(2,'0'))}</b><small class="sans t">${esc(C[lang].units[i])}</small></div>`).join('');
    }
    let io;
    function observe(){
      if(io)io.disconnect();
      io=new IntersectionObserver((es)=>es.forEach((e)=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.15});
      document.querySelectorAll('.reveal').forEach((el)=>io.observe(el));
    }

    // Soft champagne dust drifting upward across every stage.
    function dust(){
      const cv=$('#dust'),ctx=cv.getContext('2d');if(!ctx||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      let w,h,dpr=Math.min(devicePixelRatio||1,2);
      const size=()=>{w=cv.width=innerWidth*dpr;h=cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';};
      size();addEventListener('resize',size);
      const ps=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.4,s:.00006+Math.random()*.00016,p:Math.random()*6.28}));
      const loop=(t)=>{
        ctx.clearRect(0,0,w,h);
        for(const p of ps){
          p.y-=p.s*16;if(p.y<-.02){p.y=1.02;p.x=Math.random();}
          const a=.25+.35*Math.sin(t/900+p.p);
          ctx.beginPath();ctx.arc((p.x+Math.sin(t/4000+p.p)*.01)*w,p.y*h,p.r*dpr,0,6.28);
          ctx.fillStyle=`rgba(214,184,124,${a})`;ctx.fill();
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }

    function showEnvelope(){
      $('#lang-box').hidden=true;$('#env-wrap').hidden=false;
      requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.add('show-env')));
    }
    function openCard(){
      if(stage.classList.contains('is-opening'))return;
      stage.classList.add('is-opening');
      setTimeout(()=>{document.body.classList.add('is-reading');stage.classList.add('is-gone');observe();},2900);
      setTimeout(()=>stage.remove(),3900);
    }
    document.querySelectorAll('[data-pick]').forEach((b)=>b.addEventListener('click',()=>{lang=b.dataset.pick;render();showEnvelope();}));
    $('#seal').addEventListener('click',openCard);
    $('.envelope').addEventListener('click',openCard);
    document.querySelectorAll('[data-lang-choice]').forEach((b)=>b.addEventListener('click',()=>{lang=b.dataset.langChoice;render();document.querySelectorAll('.reveal').forEach((el)=>el.classList.add('in'));}));

    const fs=$('#fs');
    if(document.fullscreenEnabled){
      fs.hidden=false;
      fs.addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}));
      document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'✕':'⤢';});
    }

    render();dust();setInterval(tick,1000);
    // ?open=1 jumps straight to the card (useful for sharing a direct link).
    if(params.get('open')==='1'){stage.remove();document.body.classList.add('is-reading');}
    else if(params.get('step')==='envelope'){showEnvelope();}
  </script>
