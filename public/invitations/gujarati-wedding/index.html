    };
    const CLOSES={gu:'॥ શુભમ્ ભવતુ ॥',hi:'॥ शुभम् भवतु ॥',en:'|| Shubham Bhavatu ||'};
    const escapeHtml=(text)=>String(text).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const digits=(value,lang)=>lang==='gu'?String(value).replace(/\d/g,(digit)=>'૦૧૨૩૪૫૬૭૮૯'[Number(digit)]):String(value);
    const contentNode=document.querySelector('#card-content');
    const intro=document.querySelector('.intro');
    const openButton=document.querySelector('.open-button');
    const fullscreenButton=document.querySelector('.full-toggle');
    let language='gu';
    let isOpened=false;
    const safe=(value)=>escapeHtml(value).replace(/\n/g,'<br>');
    function render(){
      const c=COPY[language];
      document.documentElement.lang=language;
      document.body.dataset.lang=language;
      document.title=language==='gu'?'શુભ લગ્ન — રાહુલ & પૂજા':language==='hi'?'शुभ विवाह — राहुल और पूजा':'Shubh Vivah — Rahul & Pooja';
      document.querySelectorAll('[data-lang-choice]').forEach((button)=>button.setAttribute('aria-pressed',String(button.dataset.langChoice===language)));
      openButton.textContent=c.openLabel;
      contentNode.innerHTML=`
        <section class="hero reveal"><div class="ganesha-wrap"><img class="ganesha" src="https://hercules-cdn.com/cdn-cgi/image/w=800,quality=85,fit=scale-down,format=auto/file_zL0LxnoGemB6CkNFazQYSu4Y" alt="Shree Ganesh"></div><p class="invocation">${safe(c.invocation)}</p><p class="mantra">${safe(c.mantra)}</p><p class="kuldevi">${safe(c.kuldevi)}</p></section>
        <section class="reveal"><article class="panel"><h2 class="couple-heading">${safe(c.heading)}</h2><div class="divider"><span></span><i></i><span></span></div><p class="invite-line">${safe(c.inviteLine)}</p><div class="person"><p class="prefix">${safe(c.groomPrefix)}</p><p class="person-name">${safe(c.groom)}</p><p class="parents">${safe(c.groomParents)}</p></div><p class="joiner">${safe(c.joiner)}</p><div class="person"><p class="prefix">${safe(c.bridePrefix)}</p><p class="person-name">${safe(c.bride)}</p><p class="parents">${safe(c.brideParents)}</p></div><div class="divider"><span></span><i></i><span></span></div><p class="date">${safe(c.mainDate)}</p><p class="muhurat">${safe(c.muhurat)}</p></article></section>
        <section class="countdown reveal"><p class="countdown-title">${safe(c.countdownTitle)}</p><div class="count-grid" id="count-grid"></div></section>
        <section class="reveal"><article class="panel"><h3 class="section-title">${safe(c.eventsTitle)}</h3><div class="divider"><span></span><i></i><span></span></div><div class="event-list">${c.events.map((event)=>`<article class="event"><h4 class="event-name">${safe(event[0])}</h4><div class="event-meta"><span class="meta-item"><span class="meta-mark">◆</span>${safe(event[1])}</span><span class="meta-item"><span class="meta-mark">◷</span>${safe(event[2])}</span><span class="meta-item"><span class="meta-mark">●</span>${safe(event[3])}</span></div></article>`).join('')}</div></article></section>
        <section class="reveal"><article class="panel"><h3 class="section-title">${safe(c.venueTitle)}</h3><div class="divider"><span></span><i></i><span></span></div><p class="venue-name">${safe(c.venue)}</p><a class="map-button" href="${MAP_URL}" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">⌖</span>${safe(c.mapLabel)}</a></article></section>
        <section class="reveal"><article class="panel"><h3 class="section-title">${safe(c.nimantrakTitle)}</h3><div class="family-list">${c.nimantrak.map((name)=>`<p>${safe(name)}</p>`).join('')}</div><div class="divider"><span></span><i></i><span></span></div><h3 class="section-title">${safe(c.swagatTitle)}</h3><div class="family-list">${c.swagat.map((name)=>`<p>${safe(name)}</p>`).join('')}</div></article></section>
        <section class="reveal"><article class="panel tahuko"><h3 class="section-title rocking">${safe(c.tahukoTitle)}</h3><div class="divider"><span></span><i></i><span></span></div><p class="poem">${safe(c.tahuko)}</p><p class="kids">${safe(c.kids)}</p></article></section>
        <section class="closing reveal"><p>${safe(c.closing)}</p><p class="auspicious">${safe(CLOSES[language])}</p></section>`;
      renderCountdown();
      observeReveals();
    }
    function renderCountdown(){
      const grid=document.querySelector('#count-grid');
      if(!grid)return;
      const diff=Math.max(0,new Date(WEDDING_DATE_ISO).getTime()-Date.now());
      const values=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];
      grid.innerHTML=values.map((value,index)=>`<div class="count-unit"><p class="count-number">${digits(String(value).padStart(2,'0'),language)}</p><p class="count-label">${safe(COPY[language].countdownUnits[index])}</p></div>`).join('');
    }
    let revealObserver;
    function observeReveals(){
      if(revealObserver)revealObserver.disconnect();
      const elements=document.querySelectorAll('.reveal');
      if(!('IntersectionObserver'in window)){elements.forEach((element)=>element.classList.add('is-visible'));return;}
      revealObserver=new IntersectionObserver((entries,observer)=>entries.forEach((entry)=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target);}}),{threshold:.18});
      elements.forEach((element)=>revealObserver.observe(element));
    }
    function makeAtmosphere(){
      const layer=document.querySelector('.petal-layer');
      const palette=['#f59e0b','#f97316','#facc15','#e11d48','#fb923c'];
      for(let i=0;i<30;i++){
        const petal=document.createElement('span');
        petal.className='petal';
        petal.style.setProperty('--left',`${Math.random()*100}%`);
        petal.style.setProperty('--size',`${8+Math.random()*12}px`);
        petal.style.setProperty('--duration',`${9+Math.random()*9}s`);
        petal.style.setProperty('--delay',`${-Math.random()*18}s`);
        petal.style.setProperty('--drift',`${(Math.random()-.5)*160}px`);
        petal.style.setProperty('--petal-color',palette[i%palette.length]);
        layer.append(petal);
      }
      for(let i=0;i<26;i++){
        const spark=document.createElement('span');
        spark.className='spark';
        spark.style.setProperty('--left',`${Math.random()*100}%`);
        spark.style.setProperty('--top',`${Math.random()*100}%`);
        spark.style.setProperty('--size',`${2+Math.random()*3}px`);
        spark.style.setProperty('--delay',`${-Math.random()*4}s`);
        layer.append(spark);
      }
    }
    document.querySelectorAll('[data-lang-choice]').forEach((button)=>button.addEventListener('click',()=>{language=button.dataset.langChoice;render();}));
    openButton.addEventListener('click',()=>{
      if(isOpened)return;
      isOpened=true;
      intro.classList.add('opening');
      makeAtmosphere();
      window.setTimeout(()=>intro.remove(),2700);
    });
    if(document.fullscreenEnabled&&document.documentElement.requestFullscreen){
      fullscreenButton.hidden=false;
      fullscreenButton.addEventListener('click',async()=>{
        try{
          if(document.fullscreenElement){await document.exitFullscreen();}
          else{await document.documentElement.requestFullscreen();}
        }catch(error){console.warn('Fullscreen could not be changed.',error);}
      });
      document.addEventListener('fullscreenchange',()=>{fullscreenButton.textContent=document.fullscreenElement?'✕':'⤢';});
    }
    const requestedLanguage=new URLSearchParams(location.search).get('lang');
    if(requestedLanguage==='gu'||requestedLanguage==='hi'||requestedLanguage==='en')language=requestedLanguage;
    render();
    // ?open=1 skips the door intro (handy for sharing a direct link to the card).
    if(new URLSearchParams(location.search).get('open')==='1'){isOpened=true;intro.remove();makeAtmosphere();}
    window.setInterval(renderCountdown,1000);
    let scrollFrame=0;
    window.addEventListener('scroll',()=>{
      if(scrollFrame)return;
      scrollFrame=requestAnimationFrame(()=>{
        const offset=Math.min(window.scrollY*.12,140);
        document.querySelector('.ambience').style.transform=`translate3d(0,${-offset}px,0)`;
        scrollFrame=0;
      });
    },{passive:true});
  </script>
