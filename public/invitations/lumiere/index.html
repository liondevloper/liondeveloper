<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf3">
  <meta name="description" content="Lumière — wedding invitation of Rahul and Pooja, 7 February 2027, Ahmedabad.">
  <title>Lumière — Rahul &amp; Pooja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Manrope:wght@300;400;500;600&family=Pinyon+Script&family=Rasa:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#2a2433;--soft:#6c6475;--gold:#b8925a;--gold2:#e2c99a;--rose:#b5546a;--pearl:#fffaf3;--line:rgba(184,146,90,.35);
      --serif:'Bodoni Moda',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--script:'Pinyon Script',cursive;
      --ease:cubic-bezier(.2,.8,.2,1);--swing:cubic-bezier(.7,0,.2,1);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background-color:var(--pearl);transition:background-color 1.4s ease;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
    body.is-reading{overflow-y:auto;overflow-x:hidden}
    button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    a{color:inherit}
    button:focus-visible,a:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
    .eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
    /* Gujarati and Hindi break apart with wide tracking or fake italics, so they stay upright and tight. */
    body[data-lang="gu"] .t{font-family:'Rasa',serif;font-style:normal;letter-spacing:.02em;text-transform:none}
    body[data-lang="hi"] .t{font-family:'Tiro Devanagari Hindi',serif;font-style:normal;letter-spacing:.02em;text-transform:none}
    body[data-lang="gu"] .eyebrow.t,body[data-lang="hi"] .eyebrow.t{font-size:.95rem;font-weight:500}
    #petals{position:fixed;inset:0;z-index:1;pointer-events:none}

    /* ============================================================ intro */
    .stage{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;overflow:hidden;
      background:radial-gradient(50% 40% at 15% 15%,#fde4ea,transparent 70%),radial-gradient(45% 40% at 90% 85%,#e9e3fb,transparent 70%),radial-gradient(60% 50% at 50% 50%,#fff8ec,var(--pearl));
      transition:opacity 1.2s ease .2s,visibility 1.2s .2s}
    .stage.is-gone{opacity:0;visibility:hidden;pointer-events:none}
    .layer{grid-area:1/1;display:grid;justify-items:center;gap:30px;perspective:1500px;transition:opacity .9s ease,transform 1.2s var(--ease)}
    .layer[hidden]{display:none}
    .tilt{transform-style:preserve-3d;will-change:transform}

    /* step 1: language */
    .lang{width:min(86vw,380px);padding:40px 28px 32px;border-radius:30px;text-align:center;background:rgba(255,255,255,.72);border:1px solid #fff;
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 50px 90px rgba(110,70,100,.18),inset 0 0 0 1px rgba(184,146,90,.15);
      transform-style:preserve-3d;animation:cardIn 1.5s var(--ease) both}
    @keyframes cardIn{from{opacity:0;transform:rotateX(45deg) translateY(80px) scale(.88)}}
    .mono{position:relative;display:grid;place-items:center;width:92px;height:92px;margin:0 auto;border-radius:50%;transform:translateZ(50px);
      background:conic-gradient(from 200deg,#f6dfe6,#efe6ff,#fbeed4,#f6dfe6);box-shadow:0 18px 30px rgba(120,80,100,.2)}
    .mono:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#fffdf9}
    .mono span{position:relative;font-family:var(--script);font-size:2.3rem;color:var(--rose)}
    .lang h1{margin:24px 0 4px;font-family:var(--serif);font-weight:400;font-size:1.7rem;transform:translateZ(30px)}
    .lang .eyebrow{transform:translateZ(20px)}
    .lang-list{display:grid;gap:10px;margin-top:26px;transform-style:preserve-3d}
    .lang-list button{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:16px;border:1px solid rgba(184,146,90,.3);background:rgba(255,255,255,.8);
      font-size:1.2rem;opacity:0;animation:pop .9s var(--ease) forwards;transition:transform .35s var(--ease),border-color .3s,box-shadow .3s}
    .lang-list button:nth-child(1){animation-delay:.5s}.lang-list button:nth-child(2){animation-delay:.65s}.lang-list button:nth-child(3){animation-delay:.8s}
    .lang-list button:hover{transform:translateZ(26px);border-color:var(--gold);box-shadow:0 16px 30px rgba(184,146,90,.22)}
    .lang-list b{font-weight:500}.lang-list [data-pick="gu"] b{font-family:'Rasa',serif}.lang-list [data-pick="hi"] b{font-family:'Tiro Devanagari Hindi',serif}
    .lang-list small{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
    .lang-foot{margin:24px 0 0}
    @keyframes pop{from{opacity:0;transform:rotateX(-70deg) translateY(16px)}to{opacity:1;transform:none}}

    /* step 2: the two photos fly in */
    .duo{position:relative;display:flex;justify-content:center;align-items:center;transform-style:preserve-3d}
    .pic{position:relative;width:min(38vw,200px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:6px solid #fff;box-shadow:0 30px 60px rgba(90,60,90,.28);opacity:0;transition:transform 1.7s var(--ease),opacity 1s ease}
    .pic img{width:100%;height:100%;object-fit:cover;display:block}
    .pic.g{transform:translateX(-70vw) rotateY(80deg) rotateZ(-14deg)}
    .pic.b{transform:translateX(70vw) rotateY(-80deg) rotateZ(14deg);transition-delay:.18s}
    .layer.play .pic.g{opacity:1;transform:translateX(14px) rotateY(16deg) rotateZ(-5deg)}
    .layer.play .pic.b{opacity:1;transform:translateX(-14px) rotateY(-16deg) rotateZ(5deg) translateZ(20px)}
    .knot{position:absolute;left:50%;top:50%;z-index:3;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;background:#fff;
      box-shadow:0 14px 30px rgba(120,80,100,.25);font-family:var(--script);font-size:2rem;color:var(--rose);transform:translateZ(80px) scale(0) rotate(-120deg);transition:transform 1.1s var(--ease) 1.3s}
    .layer.play .knot{transform:translateZ(80px) scale(1) rotate(0)}
    .duo-names{margin:0;text-align:center;font-family:var(--serif);font-size:clamp(1.8rem,8vw,2.4rem);opacity:0;transform:translateY(20px);transition:all 1.1s var(--ease) 1.5s}
    .duo-names em{font-family:var(--script);font-style:normal;color:var(--rose);padding:0 8px}
    .layer.play .duo-names{opacity:1;transform:none}
    .layer.leave{opacity:0;transform:translateY(-40px) scale(.85)}

    /* step 3: the gatefold card */
    .obj{position:relative;width:min(72vw,320px);aspect-ratio:5/7;transform-style:preserve-3d;opacity:0;transform:translateY(70px) rotateX(40deg) scale(.85);transition:opacity 1.1s ease,transform 1.6s var(--ease)}
    .layer.play .obj{opacity:1;transform:none}
    .inner{position:absolute;inset:0;border-radius:20px;overflow:hidden;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(180deg,#fffdf8,#fbf0e6);box-shadow:inset 0 0 0 1px rgba(184,146,90,.3),0 50px 90px rgba(90,60,90,.3);transform:translateZ(-2px)}
    .inner img{width:96px;aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 0 5px rgba(184,146,90,.35)}
    .inner h2{margin:6px 0;font-family:var(--script);font-weight:400;font-size:2.4rem;color:var(--rose)}
    .door{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;transition:transform 1.5s var(--swing) .25s}
    .door.l{left:0;transform-origin:left center}.door.r{right:0;transform-origin:right center}
    .stage.open .door.l{transform:rotateY(-160deg)}.stage.open .door.r{transform:rotateY(160deg)}
    .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .door.l .face{border-radius:20px 0 0 20px}.door.r .face{border-radius:0 20px 20px 0}
    .face.back{transform:rotateY(180deg);background:linear-gradient(200deg,#fff9f1,#f3e6d6);box-shadow:inset 0 0 0 1px rgba(184,146,90,.3)}
    /* Each door shows its half of one shared cover photo. */
    .art{position:absolute;top:0;bottom:0;width:200%;background-size:cover;background-position:center}
    .door.l .art{left:0}.door.r .art{left:-100%}
    .art:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,250,243,0) 40%,rgba(42,36,51,.75))}
    .art:after{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.65);border-radius:12px}
    .art p{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font-family:var(--script);font-size:2.2rem;color:#fff}
    .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.8;background:linear-gradient(115deg,transparent 30%,rgba(255,220,235,.95) 44%,rgba(220,235,255,.95) 52%,rgba(255,240,205,.9) 58%,transparent 70%);background-size:300% 100%;background-position:var(--sx,50%) 0}
    .seal{position:absolute;left:50%;top:44%;width:90px;height:90px;margin:-45px 0 0 -45px;border:0;padding:0;border-radius:50%;display:grid;place-items:center;transform:translateZ(20px);
      background:conic-gradient(from 210deg,#f3d9b0,#f6d6e0,#e7dcff,#f3d9b0);box-shadow:0 18px 30px rgba(60,30,50,.35);transition:transform .9s var(--ease),opacity .6s}
    .seal:before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#fbf3ea 60%,#f0e2d2)}
    .seal span{position:relative;font-family:var(--script);font-size:1.8rem;color:var(--rose)}
    .seal i{position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.9);animation:ping 2.4s ease-out infinite}
    .stage.open .seal{transform:translateZ(240px) scale(1.5);opacity:0}
    .hint{margin:0;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--soft);opacity:0;transition:opacity 1s ease 1.4s}
    .layer.play .hint{opacity:1}
    .stage.open .hint{opacity:0;transition-delay:0s}
    .stage.zoom #cardLayer{transform:scale(3.2);opacity:0;transition:transform 1.5s var(--swing),opacity 1s ease .4s}
    @keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}

    /* ============================================================ page */
    .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:max(12px,env(safe-area-inset-top)) 12px 0;opacity:0;pointer-events:none;transition:opacity 1s 1s}
    body.is-reading .topbar{opacity:1;pointer-events:auto}
    .pill{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(184,146,90,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .pill button{border:0;background:none;padding:7px 12px;border-radius:999px;font-size:.8rem}
    .pill [data-lang-choice="gu"]{font-family:'Rasa',serif}.pill [data-lang-choice="hi"]{font-family:'Tiro Devanagari Hindi',serif}
    .pill button[aria-pressed="true"]{background:var(--ink);color:#fff}
    .tools{display:flex;gap:8px}
    .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(184,146,90,.3);background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;padding:0}
    .icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .page{position:relative;z-index:2;opacity:0;transition:opacity 1.4s ease}
    body.is-reading .page{opacity:1}
    .hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;padding:90px 20px 80px;overflow:hidden;perspective:1200px}
    .hero-in{position:relative;max-width:640px}
    .ganesh{position:relative;width:clamp(120px,34vw,170px);aspect-ratio:1;margin:0 auto;animation:hover 6s ease-in-out infinite}
    .ganesh img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#fbf7f0;box-shadow:0 20px 40px rgba(184,146,90,.25),0 0 0 6px #fff,0 0 0 7px rgba(184,146,90,.35)}
    .ganesh{transform-style:flat;isolation:isolate}
    .halo{position:absolute;inset:-14%;border-radius:50%;border:1px dashed rgba(184,146,90,.55);animation:spin 30s linear infinite}
    .halo.h2{inset:-28%;border-style:solid;border-color:rgba(181,84,106,.18);animation-duration:45s;animation-direction:reverse}
    .halo.h2:before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 14px 4px rgba(226,201,154,.8)}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Kept flat (no rotateY): turning inside the 3D hero made the medallion clip against the other layers. */
    @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .invoke{margin:34px 0 0;font-family:var(--serif);font-size:1rem;color:var(--gold);letter-spacing:.06em}
    .hero .eyebrow{margin:18px 0 0}
    .names{margin:20px 0;font-weight:400;line-height:1;perspective:900px;transform-style:preserve-3d}
    .names .word{display:block;font-family:var(--script);font-size:clamp(4rem,19vw,8rem);color:var(--ink)}
    body[data-lang="gu"] .names .word{font-family:'Rasa',serif;font-weight:500;font-size:clamp(3.2rem,15vw,6rem)}
    body[data-lang="hi"] .names .word{font-family:'Tiro Devanagari Hindi',serif;font-size:clamp(3.2rem,15vw,6rem)}
    .names .ch{display:inline-block;opacity:0;transform:rotateX(-100deg) translateZ(40px);transform-origin:50% 100%;transition:transform 1.4s var(--ease),opacity 1s ease;transition-delay:calc(.7s + var(--i)*80ms)}
    .names .and{display:block;margin:4px 0;font-family:var(--serif);font-style:italic;font-size:1.6rem;color:var(--rose);opacity:0;transform:scale(.3) rotate(-30deg);transition:transform 1.2s var(--ease) 1.2s,opacity 1s ease 1.2s}
    body.is-reading .names .ch,body.is-reading .names .and{opacity:1;transform:none}
    .fade{opacity:0;transform:translateY(20px);transition:opacity 1.2s ease,transform 1.2s var(--ease);transition-delay:var(--d,0s)}
    body.is-reading .fade{opacity:1;transform:none}
    .chip{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(184,146,90,.3);box-shadow:0 20px 40px rgba(120,80,100,.1);font-size:.95rem;color:var(--soft)}
    .chip b{font-weight:600;color:var(--ink)}
    .cue{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:grid;justify-items:center;gap:8px}
    body.is-reading .cue.fade{transform:translateX(-50%)}
    .cue i{width:1px;height:44px;background:linear-gradient(var(--gold),transparent);animation:drip 2.2s ease-in-out infinite;transform-origin:top}
    @keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

    .wrap{width:min(100% - 28px,960px);margin:0 auto;display:grid;gap:clamp(60px,11vw,120px);padding-bottom:30px}
    .scroll3d{transform:perspective(1300px) rotateX(var(--rx,0deg)) translateZ(var(--tz,0px)) scale(var(--sc,1));will-change:transform}
    .panel{position:relative;border-radius:32px;padding:clamp(34px,7vw,64px) clamp(20px,6vw,56px);text-align:center;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.95);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 40px 80px rgba(90,60,90,.12),inset 0 0 0 1px rgba(184,146,90,.12)}
    .h{margin:12px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,7.5vw,3.2rem);line-height:1.15}
    .body{max-width:560px;margin:18px auto 0;color:var(--soft);font-size:1.05rem;line-height:1.85}
    body[data-lang="gu"] .body,body[data-lang="hi"] .body{font-size:1.15rem}
    .reveal{opacity:0;transform:translateY(30px) rotateX(-30deg);transform-origin:50% 0;transition:opacity 1.1s ease,transform 1.2s var(--ease);transition-delay:var(--d,0s)}
    .reveal.in{opacity:1;transform:none}

    .people{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-top:40px;perspective:1200px}
    .weds{font-family:var(--script);font-size:2.4rem;color:var(--rose)}
    body[data-lang="gu"] .weds,body[data-lang="hi"] .weds{font-family:'Rasa',serif;font-size:1.6rem}
    .d3{opacity:0;transform:rotateY(var(--ry0,30deg)) translateZ(-150px);transform-style:preserve-3d;transition:opacity 1s ease,transform 1.3s var(--ease);transition-delay:var(--d,0s)}
    .d3.in{opacity:1;transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg))}
    .d3.in.tilting{transition:transform .15s linear}
    .person.b,.ev:nth-child(even){--ry0:-30deg}
    .person{padding:18px 18px 26px;border-radius:26px;background:#fff;box-shadow:0 30px 60px rgba(90,60,90,.14)}
    .person .photo{aspect-ratio:3/4;border-radius:18px;overflow:hidden;transform:translateZ(30px)}
    .person .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .person .pre{margin:18px 0 0;color:var(--gold);font-size:.95rem}
    .person .who{margin:4px 0 0;font-family:var(--script);font-weight:400;font-size:2.6rem;color:var(--ink);transform:translateZ(40px)}
    body[data-lang="gu"] .person .who,body[data-lang="hi"] .person .who{font-size:2rem;font-weight:500}
    .person .par{margin:8px 0 0;color:var(--soft);font-size:.98rem;line-height:1.6}

    .count{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.4vw,16px);max-width:600px;margin:34px auto 0;perspective:800px}
    .unit{display:grid;gap:10px;justify-items:center}
    .num{position:relative;width:100%;aspect-ratio:1/1.1;display:grid;place-items:center;border-radius:18px;background:#fff;box-shadow:0 18px 30px rgba(90,60,90,.12),inset 0 0 0 1px rgba(184,146,90,.2);overflow:hidden}
    .num:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(184,146,90,.25)}
    .num span{font-family:var(--serif);font-size:clamp(1.6rem,7vw,3rem);display:block}
    body[data-lang="gu"] .num span{font-family:'Rasa',serif}
    .num span.flip{animation:flip .6s var(--ease)}
    @keyframes flip{from{transform:rotateX(-90deg);opacity:.2}to{transform:none;opacity:1}}
    .unit small{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}

    /* Flex-wrap centres the odd last card instead of leaving a hole in the grid. */
    .events{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:36px;perspective:1200px;text-align:left}
    .ev{flex:0 1 calc(50% - 8px);padding:24px 22px;border-radius:22px;background:#fff;box-shadow:0 20px 40px rgba(90,60,90,.1)}
    .ev .no{font-family:var(--serif);font-style:italic;color:var(--gold)}
    .ev h3{margin:8px 0 6px;font-family:var(--serif);font-weight:400;font-size:1.35rem;transform:translateZ(30px)}
    body[data-lang="gu"] .ev h3,body[data-lang="hi"] .ev h3{font-weight:500}
    .ev p{margin:0;color:var(--soft);font-size:.95rem;line-height:1.6}
    .ev p b{color:var(--rose);font-weight:600}
    .ev.main{background:linear-gradient(135deg,#fff,#fde9ee);box-shadow:0 24px 50px rgba(181,84,106,.18),inset 0 0 0 1px rgba(181,84,106,.25)}

    .frame{max-width:420px;margin:30px auto 0;padding:12px;border-radius:28px;background:#fff;box-shadow:0 30px 60px rgba(90,60,90,.16)}
    .frame img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;text-decoration:none;font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border:1px solid rgba(42,36,51,.2);background:#fff;transition:transform .3s var(--ease),box-shadow .3s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(90,60,90,.14)}
    .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
    body[data-lang="gu"] .btn,body[data-lang="hi"] .btn{font-size:.95rem;letter-spacing:.02em}

    .fam{display:grid;gap:8px;margin-top:14px;font-size:1.12rem;color:var(--ink)}
    .fam p{margin:0}
    .fam+.eyebrow{display:block;margin-top:38px}

    .tahuko{position:relative;max-width:560px;margin:0 auto;padding:40px 24px;border-radius:26px;background:#fff;box-shadow:0 24px 50px rgba(184,146,90,.18)}
    .poem{margin:18px 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,4.4vw,1.4rem);line-height:1.8;color:var(--rose)}
    .kids{margin:22px 0 0;font-weight:500;color:var(--ink)}

    .closing{text-align:center;padding:70px 20px 100px}

            <h2 class="h t reveal" style="--d:.1s">${esc(c.evH)}</h2>
            <div class="events">${c.events.map((e, i) => `<article class="ev d3${e[4] ? ' main' : ''}" style="--d:${(i % 2) * 0.12}s" data-tilt><span class="no">${num(String(i + 1).padStart(2, '0'))}</span><h3 class="t">${esc(e[0])}</h3><p class="t">${esc(e[1])} · <b>${esc(e[2])}</b><br>${esc(e[3])}</p></article>`).join('')}</div>
          </section>
          <section class="panel scroll3d" data-bg="${BG.venue}">
            <p class="eyebrow t reveal">${esc(c.venueLabel)}</p>
            <h2 class="h t reveal" style="--d:.1s">${esc(c.venueH)}</h2>
            <p class="body t reveal" style="--d:.2s">${esc(c.venue)}</p>
            <div class="frame d3" data-tilt><img src="${IMG.couple}" alt="Rahul and Pooja" loading="lazy"></div>
            <div class="actions reveal" style="--d:.3s">
              <a class="btn solid t" href="${MAP_URL}" target="_blank" rel="noopener noreferrer">${esc(c.map)} →</a>
              <a class="btn t" href="${CAL_URL}" target="_blank" rel="noopener noreferrer">${esc(c.cal)}</a>
            </div>
          </section>
          <section class="panel scroll3d" data-bg="${BG.family}">
            <p class="eyebrow t reveal">${esc(c.famLabel)}</p>
            <div class="fam reveal" style="--d:.1s">${list(c.fam)}</div>
            <p class="eyebrow t reveal">${esc(c.welLabel)}</p>
            <div class="fam reveal" style="--d:.1s">${list(c.wel)}</div>
          </section>
          <section class="panel scroll3d" data-bg="${BG.tahuko}">
            <div class="tahuko d3" data-tilt>
              <h2 class="h t">${esc(c.tahukoH)}</h2>
              <p class="poem t">${esc(c.tahuko)}</p>
              <p class="kids t">${esc(c.kids)}</p>
            </div>
          </section>
        </div>
        <section class="closing scroll3d" data-bg="${BG.closing}">
          <p class="t reveal">${esc(c.closing)}</p>
          <p class="sign reveal" style="--d:.2s">Rahul &amp; Pooja</p>
          <p class="eyebrow reveal" style="--d:.3s">07 · 02 · 2027</p>
        </section>`;
      bind();
    }

    /* ---------------------------------------------------------- page behaviour */
    let revealIO, bgIO, panels = [], digits = [];
    function bind() {
      digits = $$('#count .num span');
      panels = $$('.scroll3d');
      tick(true);
      revealIO?.disconnect(); bgIO?.disconnect();
      revealIO = new IntersectionObserver((es) => es.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); }
      }), { threshold: 0.15 });
      bgIO = new IntersectionObserver((es) => es.forEach((e) => {
        if (e.isIntersecting) document.body.style.backgroundColor = e.target.dataset.bg;
      }), { rootMargin: '-45% 0px -45% 0px' });
      $$('[data-bg]').forEach((el) => bgIO.observe(el));
      if (document.body.classList.contains('is-reading')) observe();
      if (FINE && !REDUCED) $$('[data-tilt]').forEach(tiltable);
      onScroll();
    }
    const observe = () => $$('.reveal,.d3').forEach((el) => revealIO.observe(el));

    function tiltable(card) {
      card.addEventListener('pointermove', (e) => {
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
        card.classList.add('tilting');
        card.style.setProperty('--ty', (px * 16).toFixed(2) + 'deg');
        card.style.setProperty('--tx', (-py * 16).toFixed(2) + 'deg');
      });
      card.addEventListener('pointerleave', () => {
        card.classList.remove('tilting');
        card.style.setProperty('--ty', '0deg'); card.style.setProperty('--tx', '0deg');
      });
    }

    function tick(force) {
      const d = Math.max(0, new Date(WEDDING_ISO) - Date.now());
      const v = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60];
      v.forEach((x, i) => {
        const el = digits[i]; if (!el) return;
        const text = num(String(x).padStart(2, '0'));
        if (el.textContent === text && !force) return;
        el.textContent = text;
        el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
      });
    }
    setInterval(() => tick(false), 1000);

    // Panels pivot in 3D as they pass through the screen.
    let queued = false;
    function onScroll() {
      if (queued || REDUCED) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        panels.forEach((p) => {
          const r = p.getBoundingClientRect();
          const t = Math.max(-1, Math.min(1, (r.top + r.height / 2 - innerHeight / 2) / innerHeight));
          p.style.setProperty('--rx', (t * 14).toFixed(2) + 'deg');
          p.style.setProperty('--tz', (-Math.abs(t) * 110).toFixed(1) + 'px');
          p.style.setProperty('--sc', (1 - Math.abs(t) * 0.04).toFixed(3));
        });
      });
    }
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll);

    /* ---------------------------------------------------------- intro */
    // Every intro step floats and leans toward the pointer or phone tilt.
    let target = { x: 0, y: 0 }, cur = { x: 0, y: 0 }, opened = false;
    addEventListener('pointermove', (e) => {
      if (opened) return;
      target.y = (e.clientX / innerWidth - 0.5) * 30;
      target.x = -(e.clientY / innerHeight - 0.5) * 22;
    });
    addEventListener('deviceorientation', (e) => {
      if (opened || e.gamma == null) return;
      target.y = Math.max(-20, Math.min(20, e.gamma)) * 1.1;
      target.x = Math.max(-20, Math.min(20, (e.beta || 45) - 45)) * -0.7;
    });
    function floatLoop(t) {
      if (!stage.isConnected || stage.classList.contains('is-gone')) return;
      const idle = opened || REDUCED ? 0 : 1;
      cur.x += (target.x + Math.sin(t / 2200) * 5 * idle - cur.x) * 0.06;
      cur.y += (target.y + Math.sin(t / 3000) * 10 * idle - cur.y) * 0.06;
      const lift = Math.sin(t / 1800) * 8 * idle;
      $$('[data-intro-tilt]').forEach((el) => {
        el.style.transform = `translateY(${lift.toFixed(2)}px) rotateX(${cur.x.toFixed(2)}deg) rotateY(${cur.y.toFixed(2)}deg)`;
      });
      $('#cardTilt').style.setProperty('--sx', (50 + cur.y * 2.4).toFixed(1) + '%');
      requestAnimationFrame(floatLoop);
    }
    requestAnimationFrame(floatLoop);

    const show = (layer) => {
      $$('.layer').forEach((l) => { l.hidden = l !== layer; l.classList.remove('play', 'leave'); });
      requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('play')));
    };
    function pickLanguage(next) {
      lang = next; render();
      $('#langLayer').classList.add('leave');
      setTimeout(() => {
        show($('#duoLayer'));
        // The two photos meet, then make way for the card.
        setTimeout(() => $('#duoLayer').classList.add('leave'), 3600);
        setTimeout(() => show($('#cardLayer')), 4300);
      }, 700);
    }
    function openCard() {
      if (opened || !$('#cardLayer').classList.contains('play')) return;
      opened = true; target = { x: 0, y: 0 };
      stage.classList.add('open');
      setTimeout(() => stage.classList.add('zoom'), 1600);
      setTimeout(() => { document.body.classList.add('is-reading'); stage.classList.add('is-gone'); observe(); onScroll(); }, 2400);
    }
    $$('[data-pick]').forEach((b) => b.addEventListener('click', () => pickLanguage(b.dataset.pick)));
    $('#seal').addEventListener('click', openCard);
    $('#obj').addEventListener('click', openCard);
    $$('[data-lang-choice]').forEach((b) => b.addEventListener('click', () => {
      lang = b.dataset.langChoice; render();
      $$('.reveal,.d3').forEach((el) => el.classList.add('in'));
    }));
    $('#replay').addEventListener('click', () => { location.href = location.pathname; });

    const fs = $('#fs');
    if (document.fullscreenEnabled) {
      fs.hidden = false;
      fs.addEventListener('click', () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {})));
      const EXPAND = 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3';
      document.addEventListener('fullscreenchange', () => { $('#fsPath').setAttribute('d', document.fullscreenElement ? 'M18 6 6 18M6 6l12 12' : EXPAND); });
    }

    /* ---------------------------------------------------------- falling petals */
    function petals() {
      const cv = $('#petals'), ctx = cv.getContext('2d');
      if (!ctx || REDUCED) return;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      let w, h;
      const size = () => { w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; };
      size(); addEventListener('resize', size);
      const colors = ['244,190,205', '226,201,154', '205,192,245', '250,214,190'];
      const ps = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), r: 4 + Math.random() * 7, s: 0.0004 + Math.random() * 0.0008, a: Math.random() * 6.28, spin: (Math.random() - 0.5) * 0.04, c: colors[Math.floor(Math.random() * colors.length)] }));
      const loop = (t) => {
        ctx.clearRect(0, 0, w, h);
        for (const p of ps) {
          p.y += p.s; p.a += p.spin;
          if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
          const x = (p.x + Math.sin(t / 2500 + p.a) * 0.02) * w, y = p.y * h;
          ctx.save(); ctx.translate(x, y); ctx.rotate(p.a);
          // Squashing the width fakes the petal turning over in 3D.
          ctx.scale(Math.abs(Math.cos(t / 900 + p.a)) * 0.8 + 0.2, 1);
          ctx.beginPath(); ctx.ellipse(0, 0, p.r * dpr * 0.6, p.r * dpr, 0, 0, 6.283);
          ctx.fillStyle = `rgba(${p.c},.55)`; ctx.fill(); ctx.restore();
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }

    render(); petals();
    // ?open=1 skips straight to the invitation (handy for sharing a direct link).
    if (params.get('open') === '1') {
      stage.remove(); document.body.classList.add('is-reading'); observe();
    }
  </script>
</body>
</html>
